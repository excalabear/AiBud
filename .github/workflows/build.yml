name: Build MTKang Plugin

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build with Gradle
      run: ./gradlew packageReleaseMtp --no-daemon
    
    - name: Upload MTP plugin
      uses: actions/upload-artifact@v4
      with:
        name: mtp-plugin
        path: build/outputs/mt-plugin/*.mtp
